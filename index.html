<!doctype html>
<html lang="fr" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0086cd" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Maw2idi (موعدي) — Plateforme Médicale Nationale en Tunisie</title>
    <link rel="icon" type="image/png" href="/images/favicon.png" />
    
    <!-- Google Fonts: Plus Jakarta Sans & Tajawal (Arabic) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    
    <!-- Leaflet CSS for Doctors Map -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <!-- Google Identity Services (GIS) for Google Sign-In -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script>
      try {
        if (localStorage.getItem('sahatn_theme') === 'dark') {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      } catch (e) {}
    </script>
  </head>
  <body class="bg-[#edf7f9] dark:bg-[#071120] text-slate-800 dark:text-slate-100 antialiased selection:bg-teal-500 selection:text-white font-['Plus_Jakarta_Sans'] min-h-full flex flex-col transition-colors duration-300">
    <div id="root" class="flex-1 flex flex-col min-h-screen"></div>
    <script type="module" src="/src/main.jsx"></script>
